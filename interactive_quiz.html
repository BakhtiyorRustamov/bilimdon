<div style="margin: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
  <input type="text" id="ai-input" placeholder="Ustozdan savol so'rang..." style="width: 70%; padding: 8px;">
  <button onclick="askAI()" style="padding: 8px 15px;">Yuborish</button>
  <p id="ai-response" style="margin-top: 15px; color: #333;"></p>
</div>

<script>
async function askAI() {
  const prompt = document.getElementById('ai-input').value;
  document.getElementById('ai-response').innerText = "O'ylanmoqda (Thinking)...";
  
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt })
    });
    
    const data = await response.json();
    document.getElementById('ai-response').innerText = data.answer;
  } catch (error) {
    document.getElementById('ai-response').innerText = "Xato yuz berdi. Iltimos, qayta urinib ko'ring.";
  }
}
</script>
